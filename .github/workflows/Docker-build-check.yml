name: Docker-Build-Check
on:
  pull_request:
    branches: [main]

jobs:
  builds:
    name: builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The whole stack (MySQL, MongoDB, app) runs in compose, so throwaway
      # credentials and a throwaway signing key are enough - no secrets needed.
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env

      - name: Build / Run docker compose
        run: docker compose --profile app up --build -d --wait --wait-timeout 300

      - name: Migrate + seed
        run: docker compose --profile app exec -T app sh -c "node db/migrate.js && node db/seed.js"

      - name: CRUD + transaction smoke test
        run: docker compose --profile app exec -T app node test/crud-smoke.js

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs

      - name: Shutdown containers
        if: always()
        run: docker compose --profile app down -v
