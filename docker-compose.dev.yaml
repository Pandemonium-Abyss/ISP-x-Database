services:
  nextjs:
    build:
      context: ./source/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./source/frontend:/app/frontend/
      - /app/frontend/node_modules
      - /app/frontend/.next
    environment:
      - WATCHPACK_POLLING=true
    env_file:
      - ./source/.env
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000', { redirect: 'manual' }).then(r => process.exit(r.status < 400 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 10
      start_period: 30s
  fastapi:
    build:
      context: ./source/backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./source/backend:/app/backend/
    env_file:
      - ./source/.env
    depends_on:
      # The app creates any missing tables on startup, so it needs a database
      # that is actually accepting connections, not just a started container.
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10
    environment:
      - WATCHFILES_FORCE_POLLING=true
  postgres:
    image: postgres:17-alpine
    # Published so you can reach it from your machine (psql, or pytest with
    # DATABASE_URL pointed at localhost). Inside compose the host is
    # "postgres" on 5432, which is what source/.env uses, so only the left
    # number here matters to you.
    #
    # 5433 and not 5432: a PostgreSQL installed on your own machine holds
    # 5432, and compose cannot publish a port something else is already bound
    # to. Change the left number if 5433 is taken too.
    ports:
      - "5433:5432"
    env_file:
      - ./source/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ so compose leaves these for the container's own shell to expand.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:8.0
    # MongoDB keeps a file open per collection and per index. Docker's
    # default of 1024 open files runs out and mongod aborts ("Too many open
    # files"); 64000 is what MongoDB's production notes ask for.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    # Published for Compass or mongosh from your machine, on 27018 for the
    # same reason postgres is on 5433: a local install would hold 27017.
    # Inside compose the host is "mongo" on 27017.
    ports:
      - "27018:27017"
    env_file:
      - ./source/.env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  mongo-data:
